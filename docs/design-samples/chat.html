<title>Chat — Rehman Grand Marquee</title>
<style>
/* ─────────────────────────────────────────────────────────────
   WeddingWala — Chat / inbox (WhatsApp-style). Same locked design
   language as docs/design-samples/vendor-dashboard.html: modern-
   library aesthetic, one gold accent, hairline borders, sans-serif,
   subtle status, both themes, AA, 44px targets.
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --surface-2:#FAF9F6; --surface-3:#F3F1EC;
  --ink:#1A1815; --ink-2:#605A52; --ink-3:#6E6A62; --ink-4:#8C857B;
  --border:#EBE9E3; --border-2:#DEDBD3;
  --accent:#B8863B; --accent-ink:#8A6220; --accent-wash:#F5EFE2; --accent-line:#E3D3AE; --on-accent:#FFFFFF;
  --ok:#3F7A55; --ok-wash:#EEF4EF; --warn:#8A6220; --warn-wash:#F6EEDD;
  --info:#3F6FA6; --info-wash:#EDF2F8; --bad:#A24845; --bad-wash:#F8ECEB;
  --violet:#7A4FB0; --violet-ink:#6A3C9E; --violet-wash:#F2ECFA;
  --shadow-xs:0 1px 2px rgba(20,18,15,.04);
  --shadow-sm:0 1px 3px rgba(20,18,15,.06),0 1px 2px rgba(20,18,15,.04);
  --shadow-md:0 8px 24px -12px rgba(20,18,15,.16);
  --r:12px; --r-sm:9px; --r-xs:7px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0B09; --surface:#161410; --surface-2:#121009; --surface-3:#1E1B15;
  --ink:#F5F2EC; --ink-2:#ABA498; --ink-3:#9A9184; --ink-4:#6B6558;
  --border:#26231C; --border-2:#322E25;
  --accent:#D8A85A; --accent-ink:#E7C079; --accent-wash:#221B10; --accent-line:#3A2F1A; --on-accent:#231A08;
  --ok:#7FB894; --ok-wash:#16211A; --warn:#D6A94E; --warn-wash:#221B0F;
  --info:#7FA6D6; --info-wash:#141D28; --bad:#DA9490; --bad-wash:#241614;
  --violet:#B98FE0; --violet-ink:#C6A6E8; --violet-wash:#20172F;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4); --shadow-sm:0 1px 3px rgba(0,0,0,.5);
  --shadow-md:0 10px 28px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0C0B09; --surface:#161410; --surface-2:#121009; --surface-3:#1E1B15;
  --ink:#F5F2EC; --ink-2:#ABA498; --ink-3:#9A9184; --ink-4:#6B6558;
  --border:#26231C; --border-2:#322E25;
  --accent:#D8A85A; --accent-ink:#E7C079; --accent-wash:#221B10; --accent-line:#3A2F1A; --on-accent:#231A08;
  --ok:#7FB894; --ok-wash:#16211A; --warn:#D6A94E; --warn-wash:#221B0F;
  --info:#7FA6D6; --info-wash:#141D28; --bad:#DA9490; --bad-wash:#241614;
  --violet:#B98FE0; --violet-ink:#C6A6E8; --violet-wash:#20172F;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4); --shadow-sm:0 1px 3px rgba(0,0,0,.5);
  --shadow-md:0 10px 28px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100% }
body{ margin:0; background:var(--bg); color:var(--ink);
  font-family:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-.006em; }
.tnum{ font-variant-numeric:tabular-nums; }
h1,h2,h3{ margin:0; line-height:1.2; letter-spacing:-.02em; font-weight:600; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; cursor:pointer; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
::selection{ background:var(--accent-wash); }
svg{ display:block; }
[hidden]{ display:none !important; }

/* ── Shell ─────────────────────────────────────────────────── */
.app{ display:grid; grid-template-columns:236px 1fr; height:100vh; overflow:hidden; }
.side{ background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; height:100vh; overflow-y:auto; }
.side-top{ display:flex; align-items:center; gap:10px; width:100%; padding:16px 16px 14px; border:0; border-bottom:1px solid var(--border); background:transparent; text-align:left; transition:background .12s; }
.side-top:hover{ background:var(--surface-3); }
.logo{ width:32px; height:32px; border-radius:9px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-weight:700; font-size:15px; flex:none; box-shadow:var(--shadow-xs); }
.side-top .st-txt{ flex:1; min-width:0; }
.side-top .st-name{ display:block; font-weight:600; font-size:13px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.side-top .st-sub{ display:block; font-size:11.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
.side-top .chev{ color:var(--ink-3); flex:none; }
.nav{ padding:10px 12px 4px; }
.side-spring{ flex:1 1 auto; min-height:14px; }
.nav-sec{ font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--ink-3); text-transform:uppercase; padding:14px 10px 6px; }
.nav-sec:first-child{ padding-top:2px; }
.nav a{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; min-height:36px; color:var(--ink-2); font-weight:500; font-size:13px; position:relative; transition:background .12s,color .12s; }
.nav a svg{ width:17px; height:17px; color:var(--ink-3); flex:none; }
.nav a:hover{ background:var(--surface-3); color:var(--ink); }
.nav a:hover svg{ color:var(--ink-2); }
.nav a.active{ background:var(--surface-3); color:var(--ink); font-weight:600; }
.nav a.active svg{ color:var(--accent-ink); }
.nav a.active::before{ content:""; position:absolute; left:0; top:9px; bottom:9px; width:2.5px; border-radius:0 3px 3px 0; background:var(--accent); }
.nav a .badge{ margin-left:auto; font-size:11px; font-weight:600; color:var(--ink-2); background:var(--surface-3); border:1px solid var(--border); border-radius:20px; padding:0 7px; min-width:20px; text-align:center; }
.nav a:hover .badge,.nav a.active .badge{ background:var(--surface); }
.nav a .badge.acc{ color:var(--accent-ink); background:var(--accent-wash); border-color:transparent; }
.nav a .badge.warn{ color:var(--warn); background:var(--warn-wash); border-color:transparent; }
.side-foot{ border-top:1px solid var(--border); padding:10px 12px; }
.side-foot .me{ display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:8px; }
.side-foot .me:hover{ background:var(--surface-3); }
.me .m-ava{ width:30px; height:30px; border-radius:8px; background:var(--surface-3); border:1px solid var(--border-2); color:var(--ink); display:grid; place-items:center; font-weight:600; font-size:12px; flex:none; }
.me .m-name{ font-weight:600; font-size:12.5px; }
.me .m-sub{ font-size:11px; color:var(--ink-3); }
.me .cog{ margin-left:auto; color:var(--ink-3); }
.main{ min-width:0; display:flex; flex-direction:column; height:100vh; overflow:hidden; }

/* ── Topbar ────────────────────────────────────────────────── */
.topbar{ display:flex; align-items:center; gap:12px; padding:11px 22px; min-height:57px; border-bottom:1px solid var(--border); background:var(--surface); flex:none; }
.crumb{ font-size:13px; color:var(--ink-3); display:flex; align-items:center; gap:8px; }
.crumb b{ color:var(--ink); font-weight:600; }
.crumb .sep{ color:var(--border-2); }
.tb-spring{ flex:1 }
.ibtn{ width:36px; height:36px; border-radius:9px; border:1px solid var(--border); background:var(--surface); display:grid; place-items:center; color:var(--ink-2); position:relative; transition:background .12s,border-color .12s; }
.ibtn:hover{ background:var(--surface-3); }
.ibtn svg{ width:17px; height:17px; }
.ibtn .dot{ position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:50%; background:var(--bad); border:1.5px solid var(--surface); }

/* ── Chat 3-pane ───────────────────────────────────────────── */
.chat{ flex:1; display:flex; min-height:0; }
.avatar{ position:relative; flex:none; border-radius:50%; display:grid; place-items:center; font-weight:600; background:var(--surface-3); border:1px solid var(--border-2); color:var(--ink-2); }
.avatar .src{ position:absolute; right:-1px; bottom:-1px; width:11px; height:11px; border-radius:50%; border:2px solid var(--surface); }
.src.wa{ background:var(--ok); } .src.ig{ background:var(--violet); } .src.rf{ background:var(--accent); } .src.web{ background:var(--info); }

/* Conversation list */
.clist{ width:326px; flex:none; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--surface); min-height:0; }
.clist-head{ padding:15px 16px 12px; border-bottom:1px solid var(--border); }
.clist-head .ct-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.clist-head h2{ font-size:17px; font-weight:600; letter-spacing:-.02em; }
.newchat{ width:32px; height:32px; border-radius:8px; border:1px solid var(--border-2); background:var(--surface); color:var(--ink-2); display:grid; place-items:center; }
.newchat:hover{ background:var(--surface-3); color:var(--ink); }
.newchat svg{ width:16px; height:16px; }
.csearch{ display:flex; align-items:center; gap:8px; height:36px; padding:0 11px; border:1px solid var(--border); border-radius:9px; background:var(--surface-2); color:var(--ink-3); }
.csearch input{ border:0; background:transparent; color:var(--ink); width:100%; outline:none; font-size:12.5px; }
.csearch input::placeholder{ color:var(--ink-3); }
.csearch svg{ width:15px; height:15px; }
.ctabs{ display:flex; gap:2px; padding:9px 12px; border-bottom:1px solid var(--border); }
.ctab{ height:28px; padding:0 11px; border-radius:7px; border:0; background:transparent; color:var(--ink-2); font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
.ctab:hover{ background:var(--surface-3); color:var(--ink); }
.ctab.on{ background:var(--surface-3); color:var(--ink); }
.ctab .cc{ font-size:10.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.ctab.on .cc{ color:var(--accent-ink); }
.clist-body{ flex:1; overflow-y:auto; }
.conv{ display:flex; gap:11px; padding:12px 14px; cursor:pointer; position:relative; border-bottom:1px solid var(--border); transition:background .1s; }
.conv:hover{ background:var(--surface-2); }
.conv.active{ background:var(--surface-3); }
.conv.active::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:2.5px; background:var(--accent); }
.conv .avatar{ width:44px; height:44px; font-size:13px; }
.cv-main{ flex:1; min-width:0; }
.cv-top{ display:flex; align-items:center; gap:8px; }
.cv-nm{ font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
.cv-time{ font-size:10.5px; color:var(--ink-3); flex:none; font-variant-numeric:tabular-nums; }
.cv-time.acc{ color:var(--accent-ink); font-weight:600; }
.cv-bot{ display:flex; align-items:center; gap:8px; margin-top:3px; }
.cv-prev{ font-size:12px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; display:flex; align-items:center; gap:4px; }
.cv-prev svg{ width:13px; height:13px; flex:none; color:var(--ink-4); }
.cv-prev.typing{ color:var(--ok); font-weight:600; font-style:italic; }
.cv-badge{ flex:none; min-width:19px; height:19px; padding:0 6px; border-radius:20px; background:var(--accent); color:var(--on-accent); font-size:10.5px; font-weight:700; display:grid; place-items:center; font-variant-numeric:tabular-nums; }
.cv-ctx{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; padding:1px 6px; border-radius:5px; margin-top:6px; white-space:nowrap; }
.cv-ctx.book{ color:var(--accent-ink); background:var(--accent-wash); }
.cv-ctx.lead{ color:var(--info); background:var(--info-wash); }

/* Thread */
.thread{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg); }
.th-head{ display:flex; align-items:center; gap:12px; padding:10px 18px; border-bottom:1px solid var(--border); background:var(--surface); flex:none; }
.th-head .avatar{ width:40px; height:40px; font-size:12px; }
.th-id{ min-width:0; }
.th-nm{ font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; }
.th-pres{ font-size:11.5px; color:var(--ok); font-weight:500; margin-top:1px; display:flex; align-items:center; gap:5px; }
.th-pres.off{ color:var(--ink-3); }
.th-pres i{ width:6px; height:6px; border-radius:50%; background:var(--ok); }
.th-actions{ margin-left:auto; display:flex; gap:6px; }
.thbtn{ width:36px; height:36px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--ink-2); display:grid; place-items:center; }
.thbtn:hover{ background:var(--surface-3); color:var(--ink); }
.thbtn svg{ width:17px; height:17px; }
.th-body{ flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:3px; }
.daysep{ align-self:center; font-size:11px; font-weight:600; color:var(--ink-3); background:var(--surface-3); border:1px solid var(--border); border-radius:20px; padding:3px 12px; margin:10px 0; }
.msg{ max-width:66%; padding:8px 12px 6px; border-radius:13px; font-size:13px; line-height:1.45; position:relative; box-shadow:var(--shadow-xs); margin-top:2px; }
.msg .mt{ font-size:10px; color:var(--ink-3); float:right; margin:4px 0 0 12px; display:inline-flex; align-items:center; gap:3px; font-variant-numeric:tabular-nums; }
.msg.in{ align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-top-left-radius:4px; }
.msg.out{ align-self:flex-end; background:var(--accent-wash); border:1px solid var(--accent-line); border-top-right-radius:4px; color:var(--ink); }
.msg.first-in{ margin-top:10px; }
.msg.first-out{ margin-top:10px; }
.tick{ color:var(--ink-4); } .tick.read{ color:var(--accent-ink); }
.tick svg{ width:15px; height:12px; }
.msg-doc{ display:flex; align-items:center; gap:10px; padding:4px 2px 2px; }
.msg-doc .di{ width:34px; height:34px; border-radius:8px; background:var(--surface-3); border:1px solid var(--border); display:grid; place-items:center; color:var(--accent-ink); flex:none; }
.msg-doc .di svg{ width:17px; height:17px; }
.msg-doc .dn{ font-weight:600; font-size:12.5px; } .msg-doc .ds{ font-size:11px; color:var(--ink-3); }
/* typing bubble */
.typing-b{ align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:13px; border-top-left-radius:4px; padding:11px 14px; display:flex; gap:4px; margin-top:10px; }
.typing-b i{ width:6px; height:6px; border-radius:50%; background:var(--ink-4); animation:tp 1.2s infinite; }
.typing-b i:nth-child(2){ animation-delay:.2s } .typing-b i:nth-child(3){ animation-delay:.4s }
@keyframes tp{ 0%,60%,100%{ transform:translateY(0); opacity:.4 } 30%{ transform:translateY(-4px); opacity:1 } }

/* Composer */
.composer{ flex:none; border-top:1px solid var(--border); background:var(--surface); padding:11px 16px 13px; }
.quick{ display:flex; gap:7px; margin-bottom:10px; flex-wrap:wrap; }
.qchip{ font-size:12px; font-weight:600; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:5px 12px; }
.qchip:hover{ background:var(--surface-3); color:var(--ink); border-color:var(--border-2); }
.cbar{ display:flex; align-items:flex-end; gap:9px; }
.cbtn{ width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink-3); display:grid; place-items:center; flex:none; }
.cbtn:hover{ background:var(--surface-3); color:var(--ink); }
.cbtn svg{ width:18px; height:18px; }
.cinput{ flex:1; display:flex; align-items:center; min-height:38px; padding:8px 14px; border:1px solid var(--border); border-radius:12px; background:var(--surface-2); }
.cinput input{ border:0; background:transparent; color:var(--ink); width:100%; outline:none; font-size:13px; }
.cinput input::placeholder{ color:var(--ink-3); }
.csend{ width:38px; height:38px; border-radius:10px; border:0; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; flex:none; box-shadow:var(--shadow-xs); }
.csend:hover{ filter:brightness(1.05); }
.csend svg{ width:18px; height:18px; }

/* Context rail */
.cinfo{ width:296px; flex:none; border-left:1px solid var(--border); background:var(--surface); overflow-y:auto; }
.ci-hero{ padding:22px 18px 18px; text-align:center; border-bottom:1px solid var(--border); }
.ci-hero .avatar{ width:66px; height:66px; font-size:20px; margin:0 auto 12px; }
.ci-nm{ font-size:15px; font-weight:600; }
.ci-sub{ font-size:12px; color:var(--ink-3); margin-top:3px; }
.ci-quick{ display:flex; justify-content:center; gap:8px; margin-top:14px; }
.ci-q{ width:38px; height:38px; border-radius:10px; border:1px solid var(--border-2); background:var(--surface); color:var(--ink-2); display:grid; place-items:center; }
.ci-q:hover{ background:var(--surface-3); color:var(--ink); }
.ci-q.wa:hover{ color:var(--ok); border-color:var(--ok); }
.ci-q svg{ width:17px; height:17px; }
.ci-sec{ padding:15px 18px; border-bottom:1px solid var(--border); }
.ci-sec h4{ font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); margin-bottom:11px; }
.ci-ctxcard{ border:1px solid var(--border); border-radius:10px; padding:12px; background:var(--surface-2); }
.ci-ctxcard .cc-t{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.ci-ctxcard .cc-nm{ font-weight:600; font-size:13px; }
.ci-ctxcard .cc-meta{ font-size:11.5px; color:var(--ink-3); margin-top:5px; display:flex; flex-direction:column; gap:3px; }
.ci-ctxcard .cc-meta b{ color:var(--ink-2); font-weight:600; }
.ci-ctxcard .cc-baqaya{ color:var(--warn); font-weight:600; }
.dl{ display:flex; flex-direction:column; gap:9px; }
.dl-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12.5px; }
.dl-row .k{ color:var(--ink-3); } .dl-row .v{ font-weight:600; color:var(--ink); text-align:right; }
.act{ display:flex; flex-direction:column; gap:8px; }
.act .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:38px; border-radius:9px; font-weight:600; font-size:12.5px; border:1px solid var(--border-2); background:var(--surface); color:var(--ink); }
.act .btn:hover{ background:var(--surface-3); }
.act .btn svg{ width:15px; height:15px; color:var(--ink-3); }
.act .btn.primary{ background:var(--accent); color:var(--on-accent); border-color:transparent; box-shadow:var(--shadow-xs); }
.act .btn.primary:hover{ filter:brightness(1.05); } .act .btn.primary svg{ color:var(--on-accent); }
.docrow{ display:flex; align-items:center; gap:10px; padding:8px 0; }
.docrow .di{ width:32px; height:32px; border-radius:8px; background:var(--surface-3); border:1px solid var(--border); display:grid; place-items:center; color:var(--accent-ink); flex:none; }
.docrow .di svg{ width:15px; height:15px; }
.docrow .dn{ font-weight:600; font-size:12.5px; } .docrow .ds{ font-size:11px; color:var(--ink-3); }
.docrow .dl-dl{ margin-left:auto; color:var(--ink-3); }
.docrow .dl-dl:hover{ color:var(--accent-ink); }

@media (max-width:1180px){ .cinfo{ display:none; } }
@media (max-width:820px){
  .app{ grid-template-columns:1fr; }
  .side{ position:fixed; left:0; top:0; bottom:0; width:236px; transform:translateX(-100%); z-index:50; transition:transform .2s; }
  .clist{ width:100%; }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }

/* ── Scrollbars — thin, subtle, theme-aware ─────────────────── */
*{ scrollbar-width:thin; scrollbar-color:var(--border-2) transparent; }
::-webkit-scrollbar{ width:11px; height:11px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background-color:var(--border-2); border-radius:20px; border:3px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-thumb:hover{ background-color:var(--ink-4); border:3px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-corner{ background:transparent; }
</style>

<div class="app">

    <button class="side-top" aria-haspopup="listbox">

        <span class="st-name">Rehman Grand Marquee</span>

  r.setAttribute('data-theme',next);
  try{localStorage.setItem('ww-theme',next);}catch(e){}
}

/* ── Render list ───────────────────────────────────────────── */
function lastPrev(c){
  const m=c.msgs[c.msgs.length-1];
  if(c.pres==='typing') return {typing:true,txt:'likh rahe hain…'};
  const txt=m.doc? '📄 '+m.doc.n : m.x;
  return {typing:false, out:m.t==='out', txt};
}
function renderList(filter){
  filter=filter||'all';
  const rows=CONVS.filter(c=> filter==='all'||(filter==='unread'&&c.unread>0)||(filter==='lead'&&c.kind==='lead')||(filter==='book'&&c.kind==='book'));
  document.getElementById('clistBody').innerHTML=rows.map(c=>{
    const p=lastPrev(c);
    const prev=p.typing? `<span class="cv-prev typing">${p.txt}</span>`
      : `<span class="cv-prev">${p.out?svg(IC.tick2)+' ':''}${p.txt}</span>`;
    const ctx=c.kind==='book'
      ? `<span class="cv-ctx book">${svg(IC.book,2)} ${c.ctx.label}</span>`
      : `<span class="cv-ctx lead">${svg(IC.quote,2)} ${c.ctx.label}</span>`;
    return `<div class="conv ${c.id===activeId?'active':''}" data-id="${c.id}">
      <span class="avatar" style="">${c.ava}<span class="src ${c.src}"></span></span>
      <div class="cv-main">
        <div class="cv-top"><span class="cv-nm">${c.name}</span><span class="cv-time ${c.unread?'acc':''}">${c.time}</span></div>
        <div class="cv-bot">${prev}${c.unread?`<span class="cv-badge">${c.unread}</span>`:''}</div>
        ${ctx}
      </div></div>`;
  }).join('');
  document.querySelectorAll('#clistBody .conv').forEach(el=>el.addEventListener('click',()=>select(el.dataset.id)));
  // fix tick color in preview
  document.querySelectorAll('.cv-prev svg').forEach(s=>s.style.color='var(--accent-ink)');
}

/* ── Render thread ─────────────────────────────────────────── */
function renderThread(){
  const c=CONVS.find(x=>x.id===activeId);
  const presTxt=c.pres==='online'?'online':c.pres==='typing'?'likh rahe hain…':'aakhri baar kal';
  document.getElementById('thHead').innerHTML=`
    <span class="avatar" style="width:40px;height:40px;font-size:12px">${c.ava}<span class="src ${c.src}"></span></span>
    <div class="th-id"><div class="th-nm">${c.name}</div>
      <div class="th-pres ${c.pres==='online'||c.pres==='typing'?'':'off'}">${(c.pres==='online'||c.pres==='typing')?'<i></i>':''}${presTxt}</div></div>
    <div class="th-actions">
      <button class="thbtn" aria-label="Call">${svg(IC.call)}</button>
      <button class="thbtn" aria-label="WhatsApp">${svg(IC.wa)}</button>
      <button class="thbtn" aria-label="Info">${svg(IC.more)}</button>
    </div>`;
  let html='', lastDay=null, prevT=null;
  c.msgs.forEach(m=>{
    if(m.day && m.day!==lastDay){ html+=`<div class="daysep">${m.day}</div>`; lastDay=m.day; prevT=null; }
    const first=m.t!==prevT?('first-'+m.t):''; prevT=m.t;
    const tick=m.t==='out'?`<span class="tick ${m.read?'read':''}">${svg(IC.tick2,2)}</span>`:'';
    const body=m.doc
      ? `<div class="msg-doc"><span class="di">${svg(IC.doc,1.8)}</span><div><div class="dn">${m.doc.n}</div><div class="ds">${m.doc.s}</div></div></div>`
      : m.x;
    html+=`<div class="msg ${m.t} ${first}">${body}<span class="mt">${m.time}${tick}</span></div>`;
  });
  if(c.pres==='typing') html+=`<div class="typing-b"><i></i><i></i><i></i></div>`;
  const b=document.getElementById('thBody'); b.innerHTML=html; b.scrollTop=b.scrollHeight;
  // quick replies
  document.getElementById('quick').innerHTML=c.quick.map(q=>`<button class="qchip">${q}</button>`).join('');
}

      <span class="avatar" style="width:66px;height:66px;font-size:20px">${c.ava}<span class="src ${c.src}"></span></span>

    <div class="ci-sec"><h4>${c.kind==='book'?'Booking':'Lead'} detail</h4>${ctxCard}</div>
    <div class="ci-sec"><h4>Foran karein</h4><div class="act">${actions}</div></div>
    <div class="ci-sec"><h4>Share ki hui files</h4>
      <div class="docrow"><span class="di">${svg(IC.doc,1.8)}</span><div><div class="dn">Quotation-${c.kind==='book'?(x.label.match(/#(\d+)/)||['','712'])[1]:'draft'}.pdf</div><div class="ds">PDF · 240 KB</div></div><button class="dl-dl" aria-label="Download">${svg(IC.dl)}</button></div>
      <div class="docrow"><span class="di">${svg(IC.doc,1.8)}</span><div><div class="dn">Menu-card.pdf</div><div class="ds">PDF · 180 KB</div></div><button class="dl-dl" aria-label="Download">${svg(IC.dl)}</button></div>
    </div>`;
}

function select(id){ activeId=id; renderList(curFilter); renderThread(); renderInfo(); }

/* filter tabs */
let curFilter='all';
document.getElementById('ctabs').addEventListener('click',e=>{
  const b=e.target.closest('.ctab'); if(!b)return;
  document.querySelectorAll('.ctab').forEach(t=>t.classList.remove('on'));
  b.classList.add('on'); curFilter=b.dataset.f; renderList(curFilter);
});
/* quick reply → drop into composer */
document.getElementById('quick').addEventListener('click',e=>{
  const q=e.target.closest('.qchip'); if(!q)return;
  document.getElementById('cmsg').value=q.textContent; document.getElementById('cmsg').focus();
});

renderList('all'); renderThread(); renderInfo();
